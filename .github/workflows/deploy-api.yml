
name: Deploy Vynor API to ECS

on:
  workflow_run:
    workflows: ["API CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: vynor-api
  ECS_CLUSTER: vynor-cluster
  ECS_SERVICE: vynor-api-service
  TASK_DEFINITION_FAMILY: vynor-api
  CONTAINER_NAME: vynor-api

jobs:
  deploy:
    name: Build, Migrate and Deploy API
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == 'Vivek0925/Vynor'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269608740050:role/VynorGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push API image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_FAMILY" \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Render updated task definition
        env:
          NEW_IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          jq --arg image "$NEW_IMAGE" \
            'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
            | .containerDefinitions |= map(
                if .name == "vynor-api"
                then .image = $image
                else .
                end
              )' \
            task-definition.json > task-definition-register.json

      - name: Register new ECS task definition
        id: register-task
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-register.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task-definition-arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      # Run migrations using the new image and production DB configuration.
      - name: Run production Prisma migrations
        shell: bash
        env:
          TASK_DEF_ARN: ${{ steps.register-task.outputs.task-definition-arn }}
        run: |
          set -euo pipefail

          # Reuse the API service's network configuration.
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --output json > service.json

          SERVICE_COUNT=$(jq '.services | length' service.json)

          if [ "$SERVICE_COUNT" -ne 1 ]; then
            echo "Could not find the ECS service."
            exit 1
          fi

          jq '.services[0].networkConfiguration' \
            service.json > network-configuration.json

          if [ "$(jq -r 'type' network-configuration.json)" = "null" ]; then
            echo "ECS service has no network configuration."
            exit 1
          fi

          # Preserve the service's launch type or capacity provider strategy.
          LAUNCH_TYPE=$(jq -r '.services[0].launchType // empty' service.json)
          jq '.services[0].capacityProviderStrategy // []' \
            service.json > capacity-provider-strategy.json

          # Override only the container command.
          jq -n --arg name "$CONTAINER_NAME" '{
            containerOverrides: [{
              name: $name,
              command: ["sh", "-c", "./node_modules/.bin/prisma migrate deploy"]
            }]
          }' > migration-overrides.json

          RUN_ARGS=(
            --cluster "$ECS_CLUSTER"
            --task-definition "$TASK_DEF_ARN"
            --network-configuration file://network-configuration.json
            --overrides file://migration-overrides.json
          )

          if [ -n "$LAUNCH_TYPE" ]; then
            RUN_ARGS+=(--launch-type "$LAUNCH_TYPE")
          elif [ "$(jq 'length' capacity-provider-strategy.json)" -gt 0 ]; then
            RUN_ARGS+=(--capacity-provider-strategy file://capacity-provider-strategy.json)
          else
            echo "Could not determine ECS launch type or capacity provider strategy."
            exit 1
          fi

          echo "Starting one-off production migration task..."

          aws ecs run-task "${RUN_ARGS[@]}" \
            --output json > run-task.json

          TASK_ARN=$(jq -r '.tasks[0].taskArn // empty' run-task.json)

          if [ -z "$TASK_ARN" ]; then
            echo "ECS could not start the migration task:"
            jq '.failures' run-task.json
            exit 1
          fi

          echo "Migration task started."

          # Wait until the migration container exits.
          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN"

          aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --output json > migration-result.json

          EXIT_CODE=$(jq -r \
            --arg name "$CONTAINER_NAME" \
            '.tasks[0].containers[] | select(.name == $name) | .exitCode // "missing"' \
            migration-result.json)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Production migrations failed. API deployment cancelled."
            jq '{
              stoppedReason: .tasks[0].stoppedReason,
              containers: [.tasks[0].containers[] | {
                name,
                exitCode,
                reason
              }]
            }' migration-result.json
            exit 1
          fi

          echo "Production Prisma migrations completed successfully."

      - name: Deploy API to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register-task.outputs.task-definition-arn }}"

      - name: Wait for ECS deployment stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
